<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and .lp-tagline here before any script
    runs, so crawlers and JS-off readers get the requested ?lang= immediately.
    React replaces this subtree with the identical masthead on mount.
    There is no ad script here and none is injected later: the player is ad-free.
  -->

    <div class="lp-room">
      <p class="lp-notice" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>
