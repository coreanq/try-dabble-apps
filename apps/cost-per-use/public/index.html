<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>사용단가 계산기 — Cost-per-use / Cost-per-day</title>
  <meta name="description" content="구매 가격과 구매일로 하루·1회 사용 비용을 계산하는 무료 사용단가 계산기. Free cost-per-use and cost-per-day calculator. Data stays in your browser." />
  <meta name="theme-color" content="#2563eb" />
  <meta name="application-name" content="사용단가 계산기" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="사용단가" />
  <link rel="canonical" href="https://cost-per-use.try-dabble.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cost-per-use" />
  <meta property="og:url" content="https://cost-per-use.try-dabble.com/" />
  <meta property="og:title" content="사용단가 계산기 — Cost-per-use Calculator" />
  <meta property="og:description" content="구매 물품의 하루/1회 사용 비용을 계산합니다. See the true daily and per-use cost of anything you buy." />
  <meta property="og:image" content="https://cost-per-use.try-dabble.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:locale:alternate" content="zh_CN" />
  <meta property="og:locale:alternate" content="ja_JP" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="사용단가 계산기 — Cost-per-use Calculator" />
  <meta name="twitter:description" content="구매 물품의 하루/1회 사용 비용을 계산합니다." />
  <meta name="twitter:image" content="https://cost-per-use.try-dabble.com/og-image.png" />

  <link rel="icon" href="https://cost-per-use.try-dabble.com/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="https://cost-per-use.try-dabble.com/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="https://cost-per-use.try-dabble.com/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    dialog::backdrop{background:rgba(2,6,23,.65)}
    [hidden]{display:none!important}
    .lifetime-hint{margin:0;font-size:0.72rem;color:var(--warn,#f59e0b)}
    .lifetime-hint[hidden]{display:none!important}
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3398336402999065" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">
    <p class="local-only" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>
    <script>
    (function () {
      var COPY = {
        ko: "이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.",
        en: "Your data stays on this device. Nothing is sent to our servers.",
        ja: "データはこの端末にだけ保存されます。サーバーには送りません。",
        zh: "数据仅保存在此设备，不会上传到服务器。"
      };
      var lang = "ko";
      try {
        var q = new URLSearchParams(location.search).get("lang") || "";
        q = String(q).slice(0, 2).toLowerCase();
        if (COPY[q]) lang = q;
        else {
          var s = localStorage.getItem("cpu_lang") || "";
          if (COPY[s]) lang = s;
        }
      } catch (e) {}
      var el = document.getElementById("local-only");
      if (el) el.textContent = COPY[lang];
    })();
    </script>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">₩</div>
        <div>
          <h1 id="brand-title">사용단가 계산기</h1>
          <p class="tagline" id="brand-tagline">하루·1회 사용 비용을 바로 확인</p>
        </div>
      </div>
      <label class="sr-only" id="lang-label" for="lang-select">언어</label>
      <select id="lang-select" class="lang-select" aria-label="Language">
        <option value="ko" selected>한국어</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
      </select>
    </header>

    <section class="card about" aria-label="About">
      <p id="about-text">물품 이름, 구매 가격, 구매일, 예상 사용 기간을 입력하면 하루 비용과(사용 횟수 입력 시) 1회 사용 비용을 보여 줍니다. 모든 데이터는 이 기기에만 저장됩니다.</p>
    </section>

    <section class="card">
      <div class="list-head" style="margin-bottom:0.85rem">
        <h2 id="form-title">물품 추가</h2>
        <button type="button" id="cancel-edit" class="btn btn-ghost btn-sm" hidden>취소</button>
      </div>
      <form id="item-form" class="form-grid" autocomplete="off" novalidate>
        <input type="hidden" id="item-id" />
        <label>
          <span id="label-name">물품 이름</span>
          <input id="name" type="text" maxlength="80" autocomplete="off" required placeholder="예: 패딩 점퍼" />
        </label>
        <div class="row-2">
          <label>
            <span id="label-price">구매 가격</span>
            <input id="price" type="number" inputmode="decimal" min="0" step="any" required placeholder="0" />
          </label>
          <label>
            <span id="label-date">구매일</span>
            <input id="purchase-date" type="date" required />
          </label>
        </div>
        <p id="currency-hint" style="margin:0;font-size:0.72rem;color:var(--muted)">한국어는 원(₩)으로 표시</p>
        <div class="row-2">
          <label>
            <span id="label-lifetime">예상 사용 기간</span>
            <input id="lifetime-value" type="number" inputmode="decimal" min="0" step="any" placeholder="365" />
          </label>
          <label>
            <span id="label-lifetime-unit">단위</span>
            <select id="lifetime-unit">
              <option value="days" id="opt-lifetime-days">일</option>
              <option value="months" id="opt-lifetime-months">개월</option>
              <option value="years" id="opt-lifetime-years" selected>년</option>
            </select>
          </label>
        </div>
        <p id="lifetime-hint" class="lifetime-hint" hidden></p>
        <label>
          <span id="label-uses">사용 횟수 (선택)</span>
          <input id="times-used" type="number" inputmode="numeric" min="0" step="1" placeholder="예: 12" />
        </label>
        <div id="live-preview" class="preview" aria-live="polite" hidden>
          <div class="stat">
            <div class="label" id="preview-day-label">하루 비용</div>
            <div class="value" id="preview-per-day">—</div>
          </div>
          <div class="stat">
            <div class="label" id="preview-use-label">1회 비용</div>
            <div class="value" id="preview-per-use">—</div>
          </div>
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary">저장</button>
      </form>
    </section>

    <section class="card">
      <div class="list-head">
        <h2 id="list-title">내 목록</h2>
        <span id="item-count" class="count-pill" title="최근 구매" role="button" tabindex="0">0</span>
      </div>
      <div id="empty-state" class="empty">아직 항목이 없습니다. 위에서 첫 구매를 추가해 보세요.</div>
      <div id="item-list" aria-live="polite"></div>
    </section>

    <div class="ad-slot" id="ad-slot" role="complementary" aria-label="Advertisement">
      <ins class="adsbygoogle"
           style="display:block;min-height:90px;width:100%"
           data-ad-client="ca-pub-3398336402999065"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>

    <footer class="footer">
      <a id="link-privacy" href="/privacy.html">개인정보</a>
      <a id="link-terms" href="/terms.html">이용약관</a>
      <span>try-dabble.com</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog" class="card" style="border:1px solid var(--border);max-width:20rem;padding:1.1rem">
    <form method="dialog" style="display:grid;gap:0.85rem">
      <p id="confirm-text" style="margin:0;font-weight:700">삭제할까요?</p>
      <div style="display:flex;gap:0.5rem;justify-content:flex-end">
        <button value="cancel" id="confirm-cancel" class="btn btn-ghost btn-sm">취소</button>
        <button value="confirm" id="confirm-ok" class="btn btn-danger btn-sm">삭제</button>
      </div>
    </form>
  </dialog>

  <script src="/js/i18n.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
