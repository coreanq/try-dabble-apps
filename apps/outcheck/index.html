<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and .oc-tagline here before any script
    runs, so crawlers and JS-off readers get the requested ?lang= immediately.
    React replaces this subtree with the identical masthead on mount.
  -->
  <div id="root">
    <div class="oc-hall">
      <p class="oc-notice" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>
      <header class="oc-masthead">
        <div class="oc-masthead-row">
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false" class="oc-mark">
            <rect x="14" y="8" width="30" height="50" rx="4" fill="#3f5566"/>
            <rect x="18" y="12" width="22" height="42" rx="2" fill="#dbe6ec"/>
            <circle cx="35" cy="34" r="3" fill="#3f5566"/>
            <circle cx="50" cy="16" r="7" fill="#4f8a6e"/>
            <path d="M46.5 16.2l2.4 2.4 4.6-4.8" fill="none" stroke="#f4faf6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1 id="brand-title">나갔어체크</h1>
        </div>
        <p class="oc-tagline">문·가스·차고를 원탭으로 확인하고 자정에 리셋. 계정·광고 없음.</p>
      </header>
      <!--
        Today shell. The classic script right below paints this device's
        check times from storage before the module bundle is even requested,
        so a returning reader never sees "Tap to check" flash on a row they
        already checked. React mounts over it with the same times.
      -->
      <section id="today" class="oc-shell-today">
        <p id="checked-at" class="oc-when oc-when-summary"></p>
        <ul id="check-list" class="oc-shell-list">
          <li class="oc-row" data-item-id="door"><span class="oc-when" id="checked-at-door"></span></li>
          <li class="oc-row" data-item-id="gas"><span class="oc-when" id="checked-at-gas"></span></li>
          <li class="oc-row" data-item-id="garage"><span class="oc-when" id="checked-at-garage"></span></li>
        </ul>
      </section>
    </div>
  </div>
  <!--
    First paint of today's check times. Classic, blocking, inline on purpose:
    it must run before /src/main.tsx is fetched. Reads the same keys as
    src/lib/store.ts (outcheck:day, outcheck:checks) and the same local day key
    as src/lib/day.ts. Any failure (no storage, private mode, bad JSON) is a
    silent no-op; React repaints the same text on mount anyway.
  -->
  <script>
    (function () {
      try {
        var ls = window.localStorage;
        if (!ls) return;
        var now = new Date();
        var pad = function (n) { return (n < 10 ? "0" : "") + n; };
        var today = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate());
        if (ls.getItem("outcheck:day") !== today) return;
        var checks = JSON.parse(ls.getItem("outcheck:checks") || "null");
        if (!checks || typeof checks !== "object") return;

        var LANGS = /^(ko|en|ja|zh)$/;
        var lang = null;
        try {
          var q = new URLSearchParams(location.search).get("lang");
          if (q && LANGS.test(q)) lang = q;
        } catch (e) {}
        if (!lang) {
          var m = document.cookie.match(/(?:^|;\s*)td_lang=(ko|en|ja|zh)(?:;|$)/);
          if (m) lang = m[1];
        }
        if (!lang) {
          var h = (document.documentElement.lang || "").slice(0, 2).toLowerCase();
          lang = LANGS.test(h) ? h : "ko";
        }
        var LOCALE = { ko: "ko-KR", en: "en-US", ja: "ja-JP", zh: "zh-CN" };
        var TEXT = { ko: "{time} 확인", en: "Checked {time}", ja: "{time} 確認", zh: "{time} 已确认" };
        var fmt = new Intl.DateTimeFormat(LOCALE[lang], { hour: "numeric", minute: "2-digit" });
        var say = function (d) { return TEXT[lang].replace("{time}", fmt.format(d)); };

        var latest = null;
        for (var id in checks) {
          if (!Object.prototype.hasOwnProperty.call(checks, id)) continue;
          var at = checks[id];
          if (typeof at !== "string") continue;
          var d = new Date(at);
          if (isNaN(d.getTime())) continue;
          if (!latest || d > latest) latest = d;
          var row = document.getElementById("checked-at-" + id);
          if (row) {
            row.textContent = say(d);
            var li = row.parentNode;
            if (li && li.setAttribute) li.setAttribute("data-checked-at", at);
          }
        }
        if (!latest) return;
        var sum = document.getElementById("checked-at");
        if (sum) sum.textContent = say(latest);
      } catch (e) {}
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
