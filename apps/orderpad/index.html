<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title, .op-tagline and the five promise
    chips here before any script runs, so crawlers and JS-off readers get the
    requested ?lang= — and the fail-fix — immediately.
    React replaces this subtree with the identical masthead on mount.
  -->
  <div id="root">
    <div class="op-shell">
      <p class="op-tape" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>

        <div class="op-cover-row">
          <h1 id="brand-title">주문수첩</h1>
          <svg viewBox="0 0 64 42" aria-hidden="true" focusable="false" class="block h-7 w-[42px] shrink-0 sm:h-8 sm:w-[48px]">

            <rect x="8" y="7" width="46" height="30" rx="2" fill="#f2e2a0" stroke="#221f2c" stroke-width="2.2"/>
            <rect x="4" y="4" width="46" height="30" rx="2" fill="#fffdf7" stroke="#221f2c" stroke-width="2.4"/>
            <path d="M4 9 h46" stroke="#33306e" stroke-width="3"/>
            <path d="M9 17 h26 M9 23 h20 M9 29 h14" stroke="#221f2c" stroke-width="2" opacity="0.5"/>
            <g transform="translate(31,17) rotate(-8)">
              <rect x="0" y="0" width="22" height="14" rx="2" fill="#d9ebdf" stroke="#1f6b4a" stroke-width="2.4"/>
              <path d="M5 7.5 l3.5 3.5 L17 3.5" fill="none" stroke="#1f6b4a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
        <p class="op-tagline">고객, 상품, 입금, 발송. 이 기기에만.</p>
      </header>
      <ul class="op-chips" id="promise-chips">
        <li class="op-chip" data-kind="no" id="chip-nometa">메타 연동 없음</li>
        <li class="op-chip" data-kind="no" id="chip-nologin">로그인 없음</li>
        <li class="op-chip" data-kind="no" id="chip-unlimited">건수 제한 없음</li>
        <li class="op-chip" data-kind="yes" id="chip-export">JSON·CSV 내보내기</li>
        <li class="op-chip" data-kind="yes" id="chip-persist">탭을 닫아도 남음</li>
      </ul>
    </div>
