<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and .tp-tagline here before any script
    runs, so crawlers and JS-off readers get the requested ?lang= immediately.
    React replaces this subtree with the identical masthead on mount.
  -->
  <div id="root">
    <div class="tp-shell">
      <p class="tp-tape" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>
      <header class="tp-masthead">
        <div class="tp-masthead-row">
          <h1 id="brand-title">휴지패드</h1>
          <svg viewBox="0 0 72 56" aria-hidden="true" focusable="false" class="block h-8 w-[40px] shrink-0 sm:h-10 sm:w-[52px]">
            <rect x="20" y="8" width="42" height="40" rx="2" fill="#fbefbe" stroke="#c9ae5c" stroke-width="1.5"/>
            <rect x="9" y="3" width="42" height="44" rx="2" fill="#fdf5d0" stroke="#b79a45" stroke-width="2"/>
            <path d="M9 12 H51" stroke="#b79a45" stroke-width="1.5" stroke-dasharray="3 3"/>
            <path d="M17 3 V47" stroke="#cf4a3c" stroke-width="1.5"/>
            <path d="M22 21 H44 M22 28 H44 M22 35 H37" stroke="#9db4cf" stroke-width="2" stroke-linecap="round"/>
            <circle cx="52" cy="41" r="11" fill="#f7dcd6" stroke="#b23a2e" stroke-width="2.5"/>
            <path d="M52 35 V41 L57 44" fill="none" stroke="#b23a2e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="tp-tagline">적으면 남고, 시간이 지나면 지워집니다</p>
      </header>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
