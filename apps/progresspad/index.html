<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and .pp-tagline here before any
    script runs, so crawlers and JS-off readers get the requested ?lang=
    immediately. React replaces this subtree with the identical masthead on
    mount. No ad script lives in this file or anywhere in the bundle.
  -->
  <div id="root">
    <div class="pp-app">
      <p class="pp-notice" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 로그인·광고 없음. 강제 타이머 없이 손으로 기록하면 됩니다.</p>

            <path d="M20 46c0-9 4-15 12-18" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
            <path d="M32 28c-6-1-10-6-10-12 6 0 10 4 10 12z" fill="#4ade80" stroke="#16a34a" stroke-width="1.6" stroke-linejoin="round"/>

            <rect x="14" y="46" width="36" height="7" rx="3.5" fill="#e7e5e4"/>
            <rect x="14" y="46" width="24" height="7" rx="3.5" fill="#b45309"/>

        </div>
        <p class="pp-tagline">무료 로컬 장기 과제 진행 기록. 시간 또는 % 목표, 날짜별 집중 분 기록, 진행 막대. 선택적 식물·블록 스테이지 — 강제 타이머·시드는 나무 없음. 여러 과제, JSON 백업. 계정 없음. 광고 없음.</p>
      </header>
    </div>
  </div>
