<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title, .ps-tagline and the five promise
    chips here before any script runs, so crawlers and JS-off readers get the
    requested ?lang= — and the fail-fix — immediately.
    React replaces this subtree with the identical masthead on mount.
  -->
  <div id="root">
    <div class="ps-shell">
      <p class="ps-tape" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>
      <header class="ps-tray">
        <div class="ps-tray-row">
          <h1 id="brand-title">놀이세트</h1>
          <svg viewBox="0 0 68 48" aria-hidden="true" focusable="false" class="block h-8 w-[46px] shrink-0 sm:h-9 sm:w-[52px]">
            <rect x="2" y="10" width="64" height="34" rx="9" fill="#fff4dd" stroke="#4b3a26" stroke-width="3"/>
            <rect x="8" y="17" width="16" height="20" rx="5" fill="#ffcf5c" stroke="#4b3a26" stroke-width="2.6"/>
            <circle cx="34" cy="27" r="9" fill="#8fcfe8" stroke="#4b3a26" stroke-width="2.6"/>
            <path d="M52 17 L61 36 H43 Z" fill="#9fdcc0" stroke="#4b3a26" stroke-width="2.6" stroke-linejoin="round"/>
            <path d="M22 6 h24" stroke="#ffb59d" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </div>
        <p class="ps-tagline">고른 게임만, 이어서. 이 기기에만.</p>
      </header>
      <ul class="ps-chips" id="promise-chips">
        <li class="ps-chip" data-kind="no" id="chip-nologin">로그인 없음</li>
        <li class="ps-chip" data-kind="no" id="chip-nolock">3게임 제한 없음</li>
        <li class="ps-chip" data-kind="no" id="chip-nosub">구독 없음</li>
        <li class="ps-chip" data-kind="yes" id="chip-allgames">고른 게임 전부</li>
        <li class="ps-chip" data-kind="yes" id="chip-persist">탭을 닫아도 남음</li>
      </ul>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
