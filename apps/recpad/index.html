<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and .rp-tagline here before any
    script runs, so crawlers and JS-off readers get the requested ?lang=
    immediately. React replaces this subtree with the identical masthead on
    mount. No ad script lives in this file or anywhere in the bundle, and the
    audio a user records never leaves the tab.
  -->

    <div class="rp-app">
      <p class="rp-notice" id="local-only" role="note">이 앱의 녹음과 처리는 이 기기에서만 이루어지며 서버로 보내지 않습니다. 구독·광고 없음.</p>
