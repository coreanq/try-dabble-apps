<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title, .sl-tagline and the five promise
    chips here before any script runs, so crawlers and JS-off readers get the
    requested ?lang= — and the fail-fix — immediately.
    React replaces this subtree with the identical masthead on mount.
  -->
  <div id="root">
    <div class="sl-shell">
      <p class="sl-tape" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>

        </div>
        <p class="sl-tagline">가게 이름, 매장 번호, 메모. 가나다순. 이 기기에만.</p>
      </header>
      <ul class="sl-chips" id="promise-chips">
        <li class="sl-chip" data-kind="no" id="chip-nologin">로그인 없음</li>
        <li class="sl-chip" data-kind="no" id="chip-nolock">100건 잠금 없음</li>
        <li class="sl-chip" data-kind="no" id="chip-nosheet">스프레드시트 없음</li>
        <li class="sl-chip" data-kind="yes" id="chip-export">JSON·CSV 내보내기</li>
