<body>
  <div class="app">
    <p class="local-only" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>
    <script>
    (function () {
      var COPY = {
        ko: "이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.",
        en: "Your data stays on this device. Nothing is sent to our servers.",
        ja: "データはこの端末にだけ保存されます。サーバーには送りません。",
        zh: "数据仅保存在此设备，不会上传到服务器。"
      };
      var KEY = "leftover-box:lang";
      function apply(lang) {
        var el = document.getElementById("local-only");
        if (el && COPY[lang]) el.textContent = COPY[lang];
        var sel = document.getElementById("lang-select");
        if (sel && COPY[lang]) sel.value = lang;
      }
      var lang = "ko";
      try {
        var q = new URLSearchParams(location.search).get("lang") || "";
        q = String(q).slice(0, 2).toLowerCase();
        if (COPY[q]) lang = q;
        else {
          var cookieLang = "";
          try {
            var cm = document.cookie.match(/(?:^|;\s*)td_lang=(ko|en|ja|zh)(?:;|$)/);
            if (cm && COPY[cm[1]]) cookieLang = cm[1];
          } catch (err) {}
          if (cookieLang) lang = cookieLang;
          else {
          var combo = document.getElementById("lang-select");
          var cv = combo && combo.value;
          if (cv && COPY[cv]) lang = cv;
          else {
            var s = localStorage.getItem(KEY) || "";
            if (COPY[s]) lang = s;
          }
          }
        }
      } catch (e) {}
      apply(lang);
      document.addEventListener("change", function (e) {
        if (!e.target || e.target.id !== "lang-select") return;
        var next = e.target.value;
        if (!COPY[next]) return;
        apply(next);
        try { localStorage.setItem(KEY, next); } catch (err) {}
      });
    })();
    </script>
    <header class="masthead">
      <div class="masthead-row">
        <h1 id="brand-title">반찬함</h1>
        <svg class="lunchbox-illo" viewBox="0 0 72 56" aria-hidden="true" focusable="false">
          <rect x="12" y="3" width="48" height="11" rx="3" fill="#c45c26"/>
          <rect x="20" y="6" width="24" height="5" rx="1.5" fill="#e8a06a"/>
          <rect x="6" y="13" width="60" height="39" rx="6" fill="#d9a15a"/>
          <rect x="10" y="17" width="52" height="31" rx="4" fill="#fff8ee"/>
          <rect x="13" y="20" width="22" height="14" rx="2" fill="#e8c96a"/>
          <rect x="37" y="20" width="22" height="14" rx="2" fill="#c0392b"/>
          <rect x="13" y="36" width="46" height="9" rx="2" fill="#5d7a58"/>
          <circle cx="24" cy="27" r="3" fill="#fff4d6"/>
          <circle cx="48" cy="27" r="2.5" fill="#f8ddd6"/>
        </svg>
        <label class="sr-only" id="lang-label" for="lang-select">언어</label>
        <select id="lang-select" class="lang-select" aria-label="Language">
          <option value="ko" selected>한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
      </div>
      <p class="tagline" id="brand-tagline">오래된 반찬부터 먹기</p>
    </header>

    <section class="card about" aria-label="About">
      <p id="about-text">FridgeBuddy·eggg·pecco는 재고·로그인·AI 레시피 앱입니다. 반찬함은 남은 음식 이름과 먹을 날짜만 적습니다. 계정 없이 이 브라우저에만 저장됩니다.</p>
    </section>

    <section class="card" id="add-card">
      <div class="list-head">
        <h2 id="add-title">반찬 넣기</h2>
      </div>
      <form id="add-form" class="add-form" autocomplete="off">
        <input type="hidden" id="edit-id" />
        <label>
          <span id="label-name">반찬 이름</span>
          <input id="dish-name" type="text" maxlength="120" required placeholder="어제 찌개" />
        </label>
        <div class="date-row">
          <label>
            <span id="label-cooked">만든 날</span>
            <input id="cooked-on" type="date" required />
          </label>
          <label>
            <span id="label-eatby">먹을 날</span>
            <input id="eat-by" type="date" required />
          </label>
        </div>
        <label>
          <span id="label-location">위치 (선택)</span>
          <select id="location">
            <option value="" id="loc-none">선택 안 함</option>
            <option value="fridge" id="loc-fridge">냉장고</option>
            <option value="freezer" id="loc-freezer">냉동실</option>
            <option value="other" id="loc-other">그 외</option>
          </select>
        </label>
        <label>
          <span id="label-note">한 줄 메모 (선택)</span>
          <input id="note" type="text" maxlength="200" placeholder="조금만 데우면 됨" />
        </label>
        <div class="form-actions">
          <button type="submit" id="add-save" class="btn btn-primary">저장</button>
          <button type="button" id="add-cancel" class="btn btn-ghost" hidden>취소</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="list-head">
        <h2 id="list-title">남은 반찬</h2>
        <span id="list-count" class="count-pill">0</span>
      </div>
      <div class="filters" id="status-filters">
        <button type="button" class="chip active" data-status="open">남은 것</button>
        <button type="button" class="chip" data-status="eaten">먹음</button>
      </div>
      <p class="hint" id="sort-hint">먹을 날이 가까운 것부터</p>
      <div id="items-empty" class="empty">어제 찌개부터</div>
      <div id="item-list" class="item-list" aria-live="polite"></div>
    </section>

           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});

    <section class="card tools">
      <div class="list-head">
        <h2 id="tools-title">도구</h2>
      </div>
      <div class="tool-row">
        <button type="button" id="export-btn" class="btn btn-ghost btn-sm">JSON보내기</button>
        <label class="btn btn-ghost btn-sm file-btn">
          <span id="import-label">JSON가져오기</span>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </label>
      </div>
      <p class="hint" id="tools-hint">기기를 옮길 때 JSON으로 가져가세요. 서버에는 올라가지 않습니다.</p>
    </section>

      <a id="link-terms" href="/terms.html">이용약관</a>
      <span>try-dabble.com</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog" class="dialog-form">
      <p id="confirm-text">삭제할까요?</p>
      <div class="dialog-actions">
        <span class="grow"></span>
        <button value="cancel" id="confirm-cancel" class="btn btn-ghost btn-sm">취소</button>
        <button value="confirm" id="confirm-ok" class="btn btn-danger btn-sm">삭제</button>
      </div>
    </form>
  </dialog>
