<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and .dp-tagline here before any
    script runs, so crawlers and JS-off readers get the requested ?lang=
    immediately. React replaces this subtree with the identical masthead on
    mount. No ad script lives in this file or anywhere in the bundle.
  -->
  <div id="root">
    <div class="dp-app">
      <p class="dp-notice" id="local-only" role="note">노트는 이 기기에만 저장됩니다. 로그인·광고·유료 구독 없음. 시스템 키보드가 아니라 브라우저 메모장입니다.</p>
      <header class="dp-masthead">
        <div class="dp-masthead-row">
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false" class="dp-mark">
            <rect x="8" y="6" width="48" height="52" rx="8" fill="#0369a1"/>
            <rect x="12" y="10" width="40" height="44" rx="5" fill="#faf7f0"/>
            <path d="M18 22h28M18 30h28M18 38h16" stroke="#bae6fd" stroke-width="2.4" stroke-linecap="round"/>
            <rect x="38" y="30" width="10" height="16" rx="5" fill="#0369a1"/>
            <path d="M35 42a8 8 0 0 0 16 0M43 50v4" fill="none" stroke="#0369a1" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="21" cy="47" r="5" fill="#e11d48"/>
            <circle cx="21" cy="47" r="2" fill="#ffe4e6"/>
          </svg>
          <h1 id="brand-title">딕트패드</h1>
        </div>
        <p class="dp-tagline">무료 로컬 음성 받아쓰기 메모장. 녹음 버튼으로 실시간 받아쓰기, 구두점 음성 명령, 언어 선택, JSON 백업. 계정 없음. 구독 없음.</p>
      </header>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
