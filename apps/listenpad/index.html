<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and .lnp-tagline here before any
    script runs, so crawlers and JS-off readers get the requested ?lang=
    immediately. React replaces this subtree with the identical masthead on
    mount. No ad script lives in this file or anywhere in the bundle.
  -->
  <div id="root">
    <div class="lnp-app">
      <p class="lnp-notice" id="local-only" role="note">오디오와 메모는 이 기기에만 둡니다. 업로드·로그인·광고 없음. 되감기·구간반복·배속 모두 무료.</p>
      <header class="lnp-masthead">
        <div class="lnp-masthead-row">
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false" class="lnp-mark">
            <rect x="6" y="6" width="52" height="52" rx="14" fill="#0f172a"/>
            <path d="M17 40v-8a15 15 0 0 1 30 0v8" fill="none" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
            <rect x="13" y="35" width="10" height="15" rx="4" fill="#14b8a6"/>
            <rect x="41" y="35" width="10" height="15" rx="4" fill="#14b8a6"/>
            <path d="M31 46l-6 4.5 6 4.5zM38 46l-6 4.5 6 4.5z" fill="#f59e0b"/>
          </svg>
          <h1 id="brand-title">리슨패드</h1>
        </div>
        <p class="lnp-tagline">무료 로컬 언어 듣기 플레이어. 한 탭 짧은 되감기, A–B 구간 반복, 배속. 이 기기에서 파일 선택. 계정 없음. 구독 없음.</p>
      </header>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
