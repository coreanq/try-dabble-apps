<body>
  <noscript>
    <div style="padding:2rem;color:#fff;font-family:sans-serif;text-align:center">
      <h2>Block Jumper</h2>
      <p id="noscript-js">이 게임은 자바스크립트가 필요합니다. 브라우저의 자바스크립트를 활성화해 주세요.</p>

    </div>
  </noscript>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and #portrait-hint-text here before a
    single script runs, so crawlers — which never execute JS — get the
    requested ?lang= in the FIRST HTML. React mounts over this subtree with
    the identical banner and marquee, then adds the cabinet.
  -->
  <div id="root">
    <div class="pj-shell">
      <div class="pj-noticebar">
        <p class="pj-notice" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 서버로 보내지 않습니다.</p>
      </div>
      <div class="pj-chrome">
        <header class="pj-masthead">
          <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false" class="pj-mark">
            <rect width="32" height="32" fill="#0b0b1c" />
            <rect x="1" y="24" width="12" height="7" fill="#c2703a" />
            <rect x="19" y="18" width="12" height="7" fill="#c2703a" />
            <rect x="1" y="24" width="12" height="2" fill="#6cd47c" />
            <rect x="19" y="18" width="12" height="2" fill="#6cd47c" />
            <rect x="24" y="7" width="4" height="4" fill="#ffd23f" />
            <rect x="10" y="12" width="6" height="6" fill="#59a5ff" />
            <rect x="9" y="18" width="2" height="4" fill="#59a5ff" />
            <rect x="15" y="18" width="2" height="4" fill="#59a5ff" />
            <rect x="11" y="14" width="2" height="2" fill="#eef1ff" />
          </svg>
          <div class="pj-brand">
            <h1 id="brand-title">블록점퍼</h1>
            <p id="brand-sub">네 테마 점프</p>
          </div>
        </header>
      </div>
      <div id="portrait-hint" role="note">
        <span aria-hidden="true">📱</span>
        <span id="portrait-hint-text">회전시켜주세요 (가로 모드 권장)</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
