      var hudKeys = [];
      function setHudLang(lang) {
        window.__JM_HUD_LANG = lang;
        var d = HUD[lang];
        hudKeys = d ? Object.keys(d).sort(function (a, b) { return b.length - a.length; }) : [];
      }
      function trHud(text) {
        if (typeof text !== "string") return text;
        if (!/[\uac00-\ud7a3]/.test(text)) return text;
        var d = HUD[window.__JM_HUD_LANG];
        if (!d) return text;
        if (d[text]) return d[text];
        var out = text;
        for (var i = 0; i < hudKeys.length; i++) {
          var k = hudKeys[i];
          if (out.indexOf(k) !== -1) out = out.split(k).join(d[k]);
        }
        return out;
      }
      var _fill = CanvasRenderingContext2D.prototype.fillText;
      CanvasRenderingContext2D.prototype.fillText = function (text, x, y, maxW) {
        text = trHud(text);
        if (arguments.length < 4) return _fill.call(this, text, x, y);
        return _fill.call(this, text, x, y, maxW);
      };
      var KEY = "jm_lang";
      function langNow() {
        try {
          var q = (new URLSearchParams(location.search).get("lang") || "").slice(0, 2).toLowerCase();
          if (COPY[q]) return q;
          var cm = document.cookie.match(/(?:^|;\s*)td_lang=(ko|en|ja|zh)(?:;|$)/);
          if (cm && COPY[cm[1]]) return cm[1];
          var htmlLang = (document.documentElement.lang || "").slice(0, 2).toLowerCase();
          if (COPY[htmlLang]) return htmlLang;
          var s = localStorage.getItem(KEY) || "";
          if (COPY[s]) return s;
        } catch (e) {}
        return "ko";
      }
      function apply(lang, persist) {
        var copy = COPY[lang] || COPY.ko;
        var el = document.getElementById("local-only");
        var sel = document.getElementById("local-only-lang");
        var hint = document.getElementById("portrait-hint-text");
        var nsJs = document.getElementById("noscript-js");
        var nsTh = document.getElementById("noscript-themes");
        var h1 = document.getElementById("sr-h1") || document.querySelector("h1");
        if (el) el.textContent = copy.localOnly;
        if (sel) sel.value = lang;
        if (hint) hint.textContent = copy.portraitHint;
        if (nsJs) nsJs.textContent = copy.noscriptJs;
        if (nsTh) nsTh.textContent = copy.noscriptThemes;
        if (h1) h1.textContent = copy.title;
        var left = document.getElementById("btn-left");
        var right = document.getElementById("btn-right");
        var jump = document.getElementById("btn-jump");
        var menu = document.getElementById("btn-menu");
        if (left) left.setAttribute("aria-label", copy.ariaLeft);
        if (right) right.setAttribute("aria-label", copy.ariaRight);
        if (jump) jump.setAttribute("aria-label", copy.ariaJump);
        if (menu) menu.setAttribute("aria-label", copy.ariaMenu);
        setHudLang(lang);
        try { document.documentElement.lang = lang; } catch (e) {}
        if (persist) {
          try { localStorage.setItem(KEY, lang); } catch (e) {}
          try {
            var u = new URL(location.href);
            if (u.searchParams.get("lang") !== lang) {
              u.searchParams.set("lang", lang);
              history.replaceState(null, "", u.pathname + u.search + u.hash);
            }
          } catch (e) {}
        }
      }
      var lang = langNow();
      apply(lang, false);
      var sel = document.getElementById("local-only-lang");
      if (sel) sel.addEventListener("change", function () { apply(sel.value, true); });
    })();
