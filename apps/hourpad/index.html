<body>
  <!--
    Everything inside #root is the no-JS shell. The Worker (src/og-lang.ts)
    rewrites #local-only, h1#brand-title and .hp-tagline here before any
    script runs, so crawlers and JS-off readers get the requested ?lang=
    immediately. React replaces this subtree with the identical masthead on
    mount. No ad script lives in this file or anywhere in the bundle.
  -->

    <div class="hp-app">
      <p class="hp-notice" id="local-only" role="note">이 앱의 데이터는 이 기기에만 저장됩니다. 로그인·광고 없음. 휴식과 초과 근무 뱅크는 무료입니다.</p>

            <path d="M46.5 45l2 2 3.5 -4" fill="none" stroke="#ccfbf1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

          <h1 id="brand-title">아워패드</h1>
        </div>
        <p class="hp-tagline">무료 로컬 근무 시간 기록. 출근·휴식·퇴근. 일·주 합계와 목표 시간. 초과 근무 뱅크가 다음 주로 넘어갑니다. JSON 백업. 계정 없음. 광고 없음.</p>
      </header>
    </div>
  </div>
